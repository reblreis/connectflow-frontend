<h1>Nova Empresa</h1>

<form (ngSubmit)="salvar()">

  <div>
    <label for="nome">Nome</label>
    <input
      id="nome"
      name="nome"
      type="text"
      [(ngModel)]="empresa.nome"
      required
    />
  </div>

  <div>
    <label for="cnpj">CNPJ</label>
    <input
      id="cnpj"
      name="cnpj"
      type="text"
      [(ngModel)]="empresa.cnpj"
      required
    />
  </div>

  <div>
    <label for="email">E-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="empresa.email"
      required
    />
  </div>

  <div>
    <label for="ativa">
      <input
        id="ativa"
        name="ativa"
        type="checkbox"
        [(ngModel)]="empresa.ativa"
      />
      Empresa ativa
    </label>
  </div>

  <button type="button" (click)="voltar()">
    Cancelar
  </button>

  <button type="submit">
    Salvar
  </button>

</form>
